[project]
name = "spaid"
version = "0.2.0"
description = "Spaid Analytics — private stock-recommendation and portfolio-decision engine"
requires-python = ">=3.12,<3.14"
dependencies = [
    "polars>=1.40",
    "pyarrow>=18",
    "numpy>=2.0",
    "pandas>=2.2",
    "lxml>=5.0",          # pandas.read_html backend for the constituents table
    "httpx>=0.28",
    "yfinance>=0.2.60",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "hypothesis>=6.100",
]

[project.scripts]
spaid = "spaid.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spaid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: test requires network access (deselect with '-m \"not network\"')",
    "slow: test takes more than a few seconds",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["legacy", ".venv", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function calls in argument defaults are the FastAPI idiom
    # Collapsing a nested conditional is usually right, but not where the two
    # conditions test different things: the Piotroski tests read as nine
    # numbered checks and merging their guards obscures which test is which.
    "SIM102",
    "RUF005",  # explicit concatenation is clearer than unpacking in these spots
]
